
name: Publish validated academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload validated website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for deployment artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        shell: bash
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" --method GET --jq '.artifacts | map(select(.expired == false)) | length') || count=0
            if [ "$count" = 1 ]; then
              echo "Deployment artifact available; allowing Pages metadata to synchronize"
              sleep 30
              exit 0
            fi
            sleep 5
          done
          echo 'Deployment artifact not available' >&2
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

