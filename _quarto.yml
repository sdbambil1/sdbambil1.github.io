project:
  type: website
  output-dir: _site
  post-render:
    - python3 scripts/harden_site.py
  resources:
    - files/Silas_Bambil_PhD_CV.pdf
    - files/Silas_Bambil_Professional_CV.pdf
    - assets/favicon.svg
    - assets/silas-bambil-portrait.jpeg
    - assets/georgia-statistics-day.jpeg
website:
  title: "Silas Bambil"
  description: "Statistics, predictive model evaluation, and quantitative risk research."
  site-url: "https://sdbambil1.github.io"
  favicon: assets/favicon.svg
  image: assets/silas-bambil-portrait.jpeg
  image-alt: "Portrait of Silas Bambil"
  open-graph: true
  twitter-card: true
  navbar:
    background: "#ffffff"
    foreground: "#233b40"
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - text: Academic & Research
        menu:
          - href: academic.qmd
            text: Academic Profile
          - href: research.qmd
            text: Research
          - href: teaching.qmd
            text: Teaching
          - href: conferences.qmd
            text: Conferences
      - href: professional-cv.qmd
        text: Professional
      - href: projects.qmd
        text: Software
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/sdbambil1
        aria-label: GitHub profile
  page-footer:
    left: "Silas Bambil · Statistics & quantitative risk"
    right:
      - text: "Academic & Research"
        href: academic.qmd
      - text: "Professional"
        href: professional-cv.qmd
      - text: "CV PDFs"
        href: cv.qmd
      - text: "Contact"
        href: contact.qmd
  search: true
format:
  html:
    include-in-header: includes/google-site-verification.html
    theme: cosmo
    css: styles-academic-v2.css
    toc: false
    lang: en
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    mainfont: "Arial, sans-serif"
    fontsize: 16px
